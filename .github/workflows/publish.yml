name: Publish

# What a tag produces: the executables, attached to the GitHub release.
#
# It fires on a tag rather than on a push — version.yml creates the tag, and a
# human can also create one by hand.
#
# **Nothing here touches a registry.** `publish` in cutver.yml does not name
# one, so a tag builds binaries and stops. Add `registry` to that list to
# publish as well — and read what it costs first: crates.io reserves a crate
# name on its first publish, permanently, for every member of the workspace.
#
# **A tag pushed by version.yml cannot start this workflow.** GitHub refuses to
# create runs from events made with the default GITHUB_TOKEN, to prevent
# recursion, so `push: tags` only ever fires for a tag a human pushes.
# `workflow_dispatch` is one of the two documented exemptions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish, e.g. v1.2.3'
        required: true
        type: string

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

# One name for the tag whichever trigger fired, at workflow level so every job
# below reads the same one. On a tag push `ref_name` is the tag; on a dispatch
# it is the branch, so the input has to win.
env:
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  artifacts:
    name: ${{ matrix.target }}
    # **Windows and Linux, the two platforms this actually targets.**
    #
    # `cutver init` scaffolds macOS too and it was left in for exactly one run,
    # which failed: `alloyfs-cli` pulls `alloyfs-mount-fuse` under
    # `cfg(unix)` — and `cfg(unix)` is true on macOS — so `fuser` looks for
    # libfuse through pkg-config and a macOS runner has none. Supporting it
    # would mean installing macFUSE in CI and meaning it as a platform; the
    # README lists WinFsp and Linux and says nothing about macOS.
    # The two musl rows are what the .deb packages are built from — static
    # binaries with no glibc floor, so ONE package per architecture covers
    # every Debian and Ubuntu release (and the azure deployment runs exactly
    # this x86_64 musl artifact). The gnu row stays for anyone who wants the
    # dynamically-linked binary; ci.yml still gates PRs on gnu + msvc only,
    # since musl adds link-time coverage, not compile-time.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,  deb_arch: amd64 }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl, deb_arch: arm64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # musl prerequisites. x86_64 links through musl-gcc (the recipe the
      # azure deployment binary has always used); aarch64 needs no C
      # toolchain at all — the workspace is pure Rust on Linux targets, so
      # rust-lld links it self-contained. Both proven locally before landing
      # here: the aarch64 artifact links, debs, and runs `--version` under
      # qemu-aarch64.
      - name: musl toolchain
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: |
          sudo apt-get update -q
          sudo apt-get install -y musl-tools
      - name: aarch64 linker
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_RUSTFLAGS=-C linker=rust-lld" >> "$GITHUB_ENV"

      # The same two prerequisites ci.yml installs, and for the same reasons.
      # A release build that skipped them would fail here rather than in CI —
      # after the tag is already public, which is the worst place to find out.
      - name: Install WinFsp (with SDK)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi" -OutFile winfsp.msi
          Start-Process msiexec -ArgumentList '/i','winfsp.msi','/qn','INSTALLLEVEL=1000' -Wait
          Remove-Item winfsp.msi

      - name: Point bindgen at preinstalled LLVM
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append $env:GITHUB_ENV

      # `--workspace` rather than `-p alloyfs-cli`, matching ci.yml: it exercises
      # the pinned release profile across every crate, and `lto = false` there is
      # load-bearing (see the comment in the workspace Cargo.toml). `--target` is
      # passed even where it equals the host so every row's output lands in the
      # same target/<triple>/release layout the collect step reads.
      - run: cargo build --workspace --release --target ${{ matrix.target }}

      # Every `[[bin]]` the workspace declares, asked of cargo rather than
      # written down. `--no-deps` keeps it to this workspace's own crates.
      #
      # **`tr -d '\r'` is not decoration.** On a Windows runner this is Git
      # Bash, jq writes CRLF, and `read -r` keeps the carriage return — so the
      # name comes through as `alloyfs\r` and the copy fails with
      # `cannot stat 'target/release/alloyfs'$'\r''.exe'`. Same family as the
      # `alloyfs-0.1.0\r` directory name packaging/install.sh already guards
      # against.
      - name: Collect the binaries
        shell: bash
        run: |
          mkdir -p dist
          ext=""
          [ "${{ runner.os }}" = "Windows" ] && ext=".exe"
          cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[].targets[] | select(.kind[] == "bin") | .name' \
            | tr -d '\r' \
            | while read -r bin; do
                cp "target/${{ matrix.target }}/release/$bin$ext" "dist/$bin-${{ matrix.target }}$ext"
              done
          ls -l dist

      # The musl rows also become .deb packages — the binary is static, so
      # the package needs no libc dependency and one deb per arch serves
      # every Debian/Ubuntu release. build-deb.sh owns the layout and the
      # semver-dash → tilde version rewrite.
      - name: Build the .deb
        if: matrix.deb_arch != ''
        run: |
          packaging/deb/build-deb.sh \
            "target/${{ matrix.target }}/release/alloyfs" "${{ matrix.deb_arch }}"
          cp target/deb/*.deb dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*

  release:
    needs: artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # **Checkout first, and that ordering is load-bearing.** `actions/checkout`
      # cleans the workspace by default, so running it *after* the download
      # deletes `staged/` — the release is created with its notes and then the
      # upload fails with `no matches found for staged/*`. Measured here, on
      # v0.4.0.
      #
      # The body comes from the changelog rather than `--notes ""`, which is why
      # this job needs the repository at all. The tag, not the branch: notes for
      # version X belong to X's commits.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: staged
          merge-multiple: true

      - name: Fetch cutver
        run: |
          curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 \
            -o /usr/local/bin/cutver \
            https://github.com/obillekyle/cutver/releases/download/v2.4.7/cutver-linux-x64
          chmod +x /usr/local/bin/cutver

      # `cutver notes` prints the section for this tag, rewritten by the
      # summariser named in cutver.yml. An unset key is not a failure — cutver
      # says so on stderr and prints the compiled section — so a missing secret
      # costs readability, never a release.
      - name: Release notes
        continue-on-error: true
        env:
          CUTVER_SUMMARIZE_KEY: ${{ secrets.CUTVER_SUMMARIZE_KEY }}
        run: cutver notes "$TAG" > notes.md || true

      - name: Attach them to the release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          [ -s notes.md ] || echo "_No release notes._" > notes.md
          case "$TAG" in
            *-*) pre=--prerelease ;;
            *)   pre= ;;
          esac
          # One checksum file per asset, beside it. Per-asset rather than a
          # single SHASUMS file because the installers download exactly one
          # binary and should fetch exactly one small file to check it —
          # a combined manifest would make every install parse a list to
          # find its own line.
          #
          # Written before the upload so the sums travel with the release
          # they describe, and computed from the very bytes being uploaded
          # rather than rebuilt.
          ( cd staged && for f in *; do
              case "$f" in *.sha256) continue ;; esac
              sha256sum "$f" | awk '{print $1}' > "$f.sha256"
            done )
          gh release create "$TAG" --repo "$REPO" --title "$TAG" --notes-file notes.md $pre \
            || gh release edit "$TAG" --repo "$REPO" --notes-file notes.md
          gh release upload "$TAG" --repo "$REPO" --clobber staged/*
