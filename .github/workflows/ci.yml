name: CI
on:
  push:
    # EVERY branch a release can be cut from, not just main. version.yml's
    # gate is ubuntu-only by design, so if a release branch does not run this
    # matrix, a Windows-only regression reaches a tag having been compiled but
    # never tested. Keep this list in step with version.yml's triggers.
    branches:
      - main
      - alpha
      - beta
      - rc
      - prerelease
      - '*-alpha'
      - '*-beta'
      - '*-rc'
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # NOTE: never add RUSTFLAGS=-Dwarnings here — the vendored path-patched
  # winfsp-sys crate is lint-uncapped (local path dep) and would fail the
  # Windows build. Deny warnings via the clippy invocation instead.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # MSVC host default on Windows — deliberately covers the toolchain path
      # the gnullvm dev machine can't test.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # winfsp-sys reads the WinFsp registry key + SDK at build time.
      # Installed straight from the upstream MSI (INSTALLLEVEL=1000 includes
      # the Developer/SDK feature) — the choco package proved unreliable (the
      # first CI run found it delisted from the community feed).
      - name: Install WinFsp (with SDK)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi" -OutFile winfsp.msi
          Start-Process msiexec -ArgumentList '/i','winfsp.msi','/qn','INSTALLLEVEL=1000' -Wait
          Remove-Item winfsp.msi
      # bindgen needs libclang; the runner image ships LLVM here.
      - name: Point bindgen at preinstalled LLVM
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append $env:GITHUB_ENV
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Prebuilt binary, so this costs seconds rather than a from-source
      # install on every run.
      - uses: taiki-e/install-action@nextest
      # nextest for the test binaries: it runs each test in its own process,
      # which is what lets .config/nextest.toml's per-test timeout name a
      # deadlocked test instead of letting the job sit until the 6-hour
      # runner limit, and what makes a test that failed then passed report as
      # FLAKY rather than as a silent green. Locally the same suite runs
      # through scripts/verify.sh, which uses nextest only if it is installed.
      - run: cargo nextest run --workspace --profile ci
        env:
          # Generous event-timing ceilings on shared runners — and nextest
          # needs them more than `cargo test` did: it runs one process per
          # logical CPU rather than one per binary, so every settle deadline
          # got tighter in practice without any of them changing. It has to
          # be set here rather than in .config/nextest.toml, which has no way
          # to set an environment variable for the test process.
          ALLOYFS_TEST_DEADLINE_MULT: "3"
      # nextest does not run doctests; this is the documented way to keep
      # them covered, and dropping it would silently stop checking every
      # example in the public API docs.
      - run: cargo test --workspace --doc
      # The one optional feature, checked on one platform. An off-by-default
      # feature that nothing builds is an off-by-default feature that stops
      # compiling, and the person who finds out is whoever turns it on to
      # take a measurement — exactly when they wanted an answer, not a build
      # error. Ubuntu only: this is a cfg-shape check, not a platform one.
      - run: cargo check -p alloyfs-cli --features mimalloc
        if: runner.os == 'Linux'
      # Exercises the pinned profile as-is (lto=false is load-bearing; see
      # the comment in the workspace Cargo.toml — do not override profiles).
      - run: cargo build --workspace --release
