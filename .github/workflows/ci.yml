name: CI
on:
  push:
    # EVERY branch a release can be cut from, not just main. version.yml's
    # gate is ubuntu-only by design, so if a release branch does not run this
    # matrix, a Windows-only regression reaches a tag having been compiled but
    # never tested. Keep this list in step with version.yml's triggers.
    branches:
      - main
      - alpha
      - beta
      - rc
      - prerelease
      - '*-alpha'
      - '*-beta'
      - '*-rc'
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # NOTE: never add RUSTFLAGS=-Dwarnings here — the vendored path-patched
  # winfsp-sys crate is lint-uncapped (local path dep) and would fail the
  # Windows build. Deny warnings via the clippy invocation instead.

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # MSVC host default on Windows — deliberately covers the toolchain path
      # the gnullvm dev machine can't test.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # winfsp-sys reads the WinFsp registry key + SDK at build time.
      # Installed straight from the upstream MSI (INSTALLLEVEL=1000 includes
      # the Developer/SDK feature) — the choco package proved unreliable (the
      # first CI run found it delisted from the community feed).
      - name: Install WinFsp (with SDK)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri "https://github.com/winfsp/winfsp/releases/download/v2.1/winfsp-2.1.25156.msi" -OutFile winfsp.msi
          Start-Process msiexec -ArgumentList '/i','winfsp.msi','/qn','INSTALLLEVEL=1000' -Wait
          Remove-Item winfsp.msi
      # bindgen needs libclang; the runner image ships LLVM here.
      - name: Point bindgen at preinstalled LLVM
        if: runner.os == 'Windows'
        run: echo "LIBCLANG_PATH=C:\Program Files\LLVM\bin" | Out-File -Append $env:GITHUB_ENV
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          ALLOYFS_TEST_DEADLINE_MULT: "3" # generous event-timing ceilings on shared runners
      # Exercises the pinned profile as-is (lto=false is load-bearing; see
      # the comment in the workspace Cargo.toml — do not override profiles).
      - run: cargo build --workspace --release
