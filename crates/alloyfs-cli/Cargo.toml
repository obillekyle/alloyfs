[package]
name = "alloyfs-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "alloyfs"
path = "src/main.rs"

[dependencies]
alloyfs-proto.workspace = true
alloyfs-common.workspace = true
alloyfs-transport.workspace = true
alloyfs-agent.workspace = true
alloyfs-client.workspace = true
alloyfs-http.workspace = true
tokio.workspace = true
futures.workspace = true
clap.workspace = true
clap_complete.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
serde_json.workspace = true
serde.workspace = true
serde_yaml.workspace = true

[target.'cfg(unix)'.dependencies]
alloyfs-mount-fuse.workspace = true

# The kernel-module backend only exists on Linux (and only matters there).
[target.'cfg(target_os = "linux")'.dependencies]
alloyfs-mount-kernel.workspace = true

[target.'cfg(windows)'.dependencies]
alloyfs-mount-winfsp.workspace = true
windows-sys.workspace = true
windows-service.workspace = true

# build.rs emits the DELAYLOAD link flags for winfsp-x64.dll (the helper is
# gnullvm-aware). Target-gated so non-Windows builds never compile winfsp.
[target.'cfg(windows)'.build-dependencies]
winfsp.workspace = true

[dev-dependencies]
tempfile.workspace = true
# `test-util` for `start_paused`: the restart supervisor's backoff ladder is
# measured in tens of seconds, and a test may not spend them. Dev-only, and
# resolver 2 keeps the feature out of the real binary.
tokio = { workspace = true, features = ["test-util"] }
