[package]
name = "alloyfs-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
alloyfs-proto.workspace = true
alloyfs-common.workspace = true
alloyfs-transport.workspace = true
tokio.workspace = true
bytes.workspace = true
serde.workspace = true
toml.workspace = true
serde_yaml.workspace = true
notify.workspace = true
dashmap.workspace = true
anyhow.workspace = true
async-trait.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
# The session tests speak the wire protocol directly, so they need the codec
# and a Sink/Stream to drive it — no socket, just a duplex pipe.
futures.workspace = true
tokio-util.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
# The v11 winattr sidecar (.alloyfs/winattrs.json) is Linux-only; Windows
# agents use the native NTFS attributes and never touch JSON.
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true
