[package]
name = "alloyfs-mount-winfsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# All real dependencies are Windows-only: on other platforms this crate
# compiles to an empty library so `cargo build` at the workspace root works
# everywhere (mirror of alloyfs-mount-fuse's cfg(unix) gating).
[target.'cfg(windows)'.dependencies]
alloyfs-proto.workspace = true
alloyfs-client.workspace = true
winfsp.workspace = true
windows-sys.workspace = true
tracing.workspace = true
anyhow.workspace = true

[target.'cfg(windows)'.build-dependencies]
winfsp.workspace = true

# Test-only: a smoke test needs a real agent to serve the volume and a real
# runtime to drive it. Windows-only for the same reason the deps above are.
[target.'cfg(windows)'.dev-dependencies]
alloyfs-agent.workspace = true
alloyfs-transport.workspace = true
tokio.workspace = true
tempfile.workspace = true

[lints]
workspace = true
