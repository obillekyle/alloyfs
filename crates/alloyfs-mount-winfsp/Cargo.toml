[package]
name = "alloyfs-mount-winfsp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# All real dependencies are Windows-only: on other platforms this crate
# compiles to an empty library so `cargo build` at the workspace root works
# everywhere (mirror of alloyfs-mount-fuse's cfg(unix) gating).
[target.'cfg(windows)'.dependencies]
alloyfs-proto.workspace = true
alloyfs-client.workspace = true
winfsp.workspace = true
windows-sys.workspace = true
tracing.workspace = true
anyhow.workspace = true
