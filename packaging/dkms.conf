# DKMS recipe for the AlloyFS kernel module.
#
# Why DKMS at all: alloyfs is an out-of-tree module, so a `.ko` is only valid
# for the exact kernel it was compiled against. Ubuntu ships a new kernel
# every few weeks; without DKMS the module silently stops loading after the
# next `apt upgrade` and reboot, and the only symptom the user sees is that
# `/dev/alloyfs` no longer exists. DKMS keeps the SOURCE installed under
# /usr/src and rebuilds it from a kernel-upgrade hook, so the module follows
# the kernel instead of rotting against it.
#
# This file is installed as /usr/src/alloyfs-<version>/dkms.conf, alongside a
# copy of kernel/alloyfs/. packaging/install.sh rewrites PACKAGE_VERSION from
# the workspace version in Cargo.toml on the way in, so the module version and
# the binary version are always the same number; the value below is the
# checked-in default so this file also works if copied by hand.

PACKAGE_NAME="alloyfs"
PACKAGE_VERSION="0.1.0"

# Reuse the module's own Makefile rather than open-coding the kbuild
# invocation, so a DKMS build and the documented developer build
# (`make KDIR=/lib/modules/$(uname -r)/build`) are literally the same command.
# DKMS runs these with the working directory set to its per-version build
# tree, which is a copy of this directory.
MAKE[0]="make KDIR=${kernel_source_dir}"
CLEAN="make KDIR=${kernel_source_dir} clean"

BUILT_MODULE_NAME[0]="alloyfs"
# Ignored by modern DKMS (which always uses /updates/dkms) but still required
# by the versions in older LTS releases.
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Rebuild automatically for every kernel installed from now on. This is the
# whole point of the exercise.
AUTOINSTALL="yes"

# ...but only for kernels this module can actually be built against.
#
# AUTOINSTALL turns a kernel the module does not support into the exact failure
# DKMS exists to prevent: `apt upgrade` succeeds, the rebuild fails somewhere in
# its log, the machine reboots, and the only thing the operator sees is that
# /dev/alloyfs is gone. A skipped build says why; a failed one says it in a file
# nobody is reading at the time.
#
# The ceiling is measured rather than guessed. The module builds and passes the
# full test suite on 6.14; on 7.0 it does not compile, against three VFS changes
# that each need a version guard:
#
#   * inode->i_state became a struct inode_state_flags behind accessors
#   * inode_operations->mkdir returns struct dentry * instead of int
#   * generic_delete_inode was replaced by inode_just_drop
#
# Exactly where between 6.14 and 7.0 each landed has not been established, so
# the ceiling sits at the last version known to work rather than at the first
# known to fail. Raise it as guards land and each version is actually tested —
# not on the assumption that a release in between is fine.
#
# The intended range is 5.x through 7.x. The floor says so; the ceiling does
# not yet, and that gap IS the version-guard work. Until it closes, a 7.x
# kernel is skipped with a reason rather than attempted and failed, which is
# the whole point of stating a range at all.
BUILD_EXCLUSIVE_KERNEL_MIN="5.0"
BUILD_EXCLUSIVE_KERNEL_MAX="6.14"

# The above needs DKMS 3.0.6+. Older releases — 22.04 LTS ships 2.8.7 — ignore
# it silently and will still attempt the build, so on those the failure mode is
# unchanged until they upgrade. A BUILD_EXCLUSIVE_KERNEL regex would reach them,
# but only by enumerating acceptable versions, which would exclude the older
# kernels MIN deliberately does not.

# No REMAKE_INITRD: it is deprecated in DKMS 3.x (which warns about it on
# every add and build), and "no" was its default anyway. alloyfs is never
# needed to reach the root filesystem, so nothing here belongs in an initramfs.
