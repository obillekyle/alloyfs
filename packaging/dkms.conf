# DKMS recipe for the AlloyFS kernel module.
#
# Why DKMS at all: alloyfs is an out-of-tree module, so a `.ko` is only valid
# for the exact kernel it was compiled against. Ubuntu ships a new kernel
# every few weeks; without DKMS the module silently stops loading after the
# next `apt upgrade` and reboot, and the only symptom the user sees is that
# `/dev/alloyfs` no longer exists. DKMS keeps the SOURCE installed under
# /usr/src and rebuilds it from a kernel-upgrade hook, so the module follows
# the kernel instead of rotting against it.
#
# This file is installed as /usr/src/alloyfs-<version>/dkms.conf, alongside a
# copy of kernel/alloyfs/. packaging/install.sh rewrites PACKAGE_VERSION from
# the workspace version in Cargo.toml on the way in, so the module version and
# the binary version are always the same number; the value below is the
# checked-in default so this file also works if copied by hand.

PACKAGE_NAME="alloyfs"
PACKAGE_VERSION="0.1.0"

# Reuse the module's own Makefile rather than open-coding the kbuild
# invocation, so a DKMS build and the documented developer build
# (`make KDIR=/lib/modules/$(uname -r)/build`) are literally the same command.
# DKMS runs these with the working directory set to its per-version build
# tree, which is a copy of this directory.
MAKE[0]="make KDIR=${kernel_source_dir}"
CLEAN="make KDIR=${kernel_source_dir} clean"

BUILT_MODULE_NAME[0]="alloyfs"
# Ignored by modern DKMS (which always uses /updates/dkms) but still required
# by the versions in older LTS releases.
DEST_MODULE_LOCATION[0]="/updates/dkms"

# Rebuild automatically for every kernel installed from now on. This is the
# whole point of the exercise.
AUTOINSTALL="yes"

# No REMAKE_INITRD: it is deprecated in DKMS 3.x (which warns about it on
# every add and build), and "no" was its default anyway. alloyfs is never
# needed to reach the root filesystem, so nothing here belongs in an initramfs.
