[workspace]
resolver = "2"
members = [
    "crates/alloyfs-proto",
    "crates/alloyfs-common",
    "crates/alloyfs-transport",
    "crates/alloyfs-agent",
    "crates/alloyfs-client",
    "crates/alloyfs-mount-fuse",
    "crates/alloyfs-mount-kernel",
    "crates/alloyfs-mount-winfsp",
    "crates/alloyfs-http",
    "crates/alloyfs-cli",
]

[workspace.package]
version = "1.0.0-alpha.17"
edition = "2021"
license = "MIT"
repository = "https://github.com/obillekyle/alloyfs"

[workspace.dependencies]
alloyfs-proto = { path = "crates/alloyfs-proto" }
alloyfs-common = { path = "crates/alloyfs-common" }
alloyfs-transport = { path = "crates/alloyfs-transport" }
alloyfs-agent = { path = "crates/alloyfs-agent" }
alloyfs-client = { path = "crates/alloyfs-client" }
alloyfs-mount-fuse = { path = "crates/alloyfs-mount-fuse" }
alloyfs-mount-kernel = { path = "crates/alloyfs-mount-kernel" }
alloyfs-mount-winfsp = { path = "crates/alloyfs-mount-winfsp" }
alloyfs-http = { path = "crates/alloyfs-http" }

serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }
lz4_flex = "0.11"
bytes = { version = "1", features = ["serde"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
serde_yaml = "0.9"
globset = "0.4"
notify = "8"
serde_json = "1"
axum = "0.8"
# Test-only: ServiceExt::oneshot, for driving the API router without a socket.
tower = { version = "0.5", features = ["util"] }
tokio-stream = { version = "0.1", features = ["sync"] }
fuser = "0.17"
libc = "0.2"
windows-sys = { version = "0.60", features = [
  "Win32_Foundation",
  "Win32_Storage_FileSystem",
  # `alloyfs service` launches the mount into the interactive session: query
  # the console session and its user token, unwrap the UAC-filtered token to
  # the elevated one behind it, and CreateProcessAsUser with the user's own
  # environment (so their SSH keys and agent are the ones in scope).
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_RemoteDesktop",
  "Win32_System_Threading",
  "Win32_System_Environment",
  "Win32_System_SystemServices",
] }
windows-service = "0.8"
winfsp = { version = "0.13.0", default-features = false, features = ["system", "delayload", "notify"] }

# The upstream winfsp-sys build script needs our llvm-mingw/bindgen fixes; the
# vendored copy carries them until they land upstream.
[patch.crates-io]
winfsp-sys = { path = "vendor/winfsp-sys" }

# Final binaries: strip debug symbols. LTO is deliberately OFF: with
# lto = "thin", reads through a mounted drive hang hard in kernel waits,
# while debug and non-LTO release are both fine. Bisected by toggling
# CARGO_PROFILE_RELEASE_LTO; the CAUSE is unproven, and the likeliest
# explanation is latent UB in our own FFI glue that cross-crate inlining
# exposes rather than a compiler bug. See docs/upstream/thin-lto-winfsp-ffi-hang.md
# before re-enabling.
[profile.release]
lto = false
strip = true
