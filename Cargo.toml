[workspace]
resolver = "2"
members = [
    "crates/ds-proto",
    "crates/ds-transport",
    "crates/ds-agent",
    "crates/ds-client",
    "crates/ds-mount-fuse",
    "crates/ds-mount-winfsp",
    "crates/ds-http",
    "crates/ds-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
ds-proto = { path = "crates/ds-proto" }
ds-transport = { path = "crates/ds-transport" }
ds-agent = { path = "crates/ds-agent" }
ds-client = { path = "crates/ds-client" }
ds-mount-fuse = { path = "crates/ds-mount-fuse" }
ds-mount-winfsp = { path = "crates/ds-mount-winfsp" }
ds-http = { path = "crates/ds-http" }

serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }
bytes = { version = "1", features = ["serde"] }
thiserror = "2"
anyhow = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec", "io"] }
futures = "0.3"
dashmap = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
toml = "0.8"
serde_yaml = "0.9"
globset = "0.4"
notify = "8"
serde_json = "1"
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
fuser = "0.17"
libc = "0.2"
winfsp = { version = "0.13.0", default-features = false, features = ["system", "delayload", "notify"] }

# The upstream winfsp-sys build script needs our llvm-mingw/bindgen fixes; the
# vendored copy carries them until they land upstream.
[patch.crates-io]
winfsp-sys = { path = "vendor/winfsp-sys" }

# Final binaries: strip debug symbols. LTO is deliberately OFF: thin-LTO
# miscompiles the WinFsp FFI path (reads through the mounted drive hang hard
# in kernel waits; debug and non-LTO release are fine). Likely latent UB in
# the FFI glue that cross-crate optimization exposes — investigate before
# ever re-enabling.
[profile.release]
lto = false
strip = true
